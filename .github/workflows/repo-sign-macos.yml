name: 🔏 Sign macOS
run-name: Sign macOS for ${{ github.ref_name }}

# Repo-owned workflow: builds, signs, and notarizes the Sockeye binary for
# macOS. Uses the fleet checkout + setup actions (under .github/actions/fleet/)
# and the repo-local import-codesign-certs action (under .github/actions/repo/).
#
# The signing identity comes from org-level GitHub secrets:
#   APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12 (secret) — base64 P12
#   APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS (secret) — P12 password
#   APPLE_APP_SPECIFIC_PASSWORD (secret) — notarytool auth
#   APPLE_ID (variable) — Apple ID email
#   APPLE_TEAM_ID (variable) — Developer Program team ID
#
# Until those secrets are in place, set adhoc: true on dispatch to build and
# ad-hoc sign without a certificate. Ad-hoc is good for local testing but not
# releasable.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      adhoc:
        default: false
        description: 'Ad-hoc sign (no certificate needed, not releasable)'
        type: boolean

permissions:
  contents: read

# The fleet env knobs come from the setup action's fleet-env.json; the
# build-sign job runs setup-and-install, so nothing is declared here.
jobs:
  build-sign:
    name: Build and sign
    runs-on: macos-14
    env:
      BUILD_MODE: prod
    permissions:
      contents: read
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          # Route context through env (no ${{ }} in the shell body —
          # zizmor expression-injection). Token authorizes the fetch inline and
          # is never persisted to .git/config.
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          checkout: 'false'
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}

      # Import the Developer ID Application certificate from the org-level
      # secret. Skipped on ad-hoc runs.
      - name: Import codesign certificate
        id: import-signing
        if: ${{ !inputs.adhoc }}
        uses: ./.github/actions/repo/import-codesign-certs
        with:
          p12-file-base64: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12 }}
          p12-password: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_CERTS_P12_PASS }}

      - name: Build prod binary
        run: pnpm run build

      - name: Sign with developer id
        if: ${{ !inputs.adhoc }}
        env:
          SOCKEYE_SIGNING_IDENTITY: 'Developer ID Application: Socket Inc. (PZRCDQ736X)'
        run: pnpm run sign --run

      - name: Sign ad-hoc
        if: ${{ inputs.adhoc }}
        run: pnpm run sign --ad-hoc --run

      - name: Create archive
        run: |
          cd build/prod/darwin-arm64/out/Final
          zip -r -X sockeye-darwin-arm64.zip sockeye

      # Notarize (skipped on ad-hoc runs — notarytool needs a
      # Developer ID signature).
      - name: Store notarytool credentials
        if: ${{ !inputs.adhoc }}
        env:
          SOCKEYE_SIGNING_KEYCHAIN: ${{ steps.import-signing.outputs.keychain }}
          APPLE_ID: ${{ vars.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool store-credentials sockeye-notary \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --keychain "$SOCKEYE_SIGNING_KEYCHAIN"

      - name: Notarize archive
        if: ${{ !inputs.adhoc }}
        env:
          SOCKEYE_SIGNING_KEYCHAIN: ${{ steps.import-signing.outputs.keychain }}
        run: pnpm run notarize --run
          build/prod/darwin-arm64/out/Final/sockeye-darwin-arm64.zip
          --keychain-profile sockeye-notary
          --keychain "$SOCKEYE_SIGNING_KEYCHAIN"

      - name: Verify developer signature
        if: ${{ !inputs.adhoc }}
        run: |
          codesign --verify --strict --verbose=4 \
            -R '=anchor apple generic and identifier "dev.socket.sockeye" and certificate leaf[subject.OU] = "PZRCDQ736X" and certificate leaf[subject.CN] = "Developer ID Application: Socket Inc. (PZRCDQ736X)"' \
            build/prod/darwin-arm64/out/Final/sockeye

      - name: Verify ad-hoc signature
        if: ${{ inputs.adhoc }}
        run: codesign --verify --strict --verbose=4 build/prod/darwin-arm64/out/Final/sockeye

      - name: Compute checksum
        run: |
          cd build/prod/darwin-arm64/out/Final
          shasum -a 256 sockeye-darwin-arm64.zip >> sockeye-darwin-arm64.zip.sha256

      - name: Upload artifact
        uses: ./.github/actions/fleet/upload-artifact
        with:
          name: ${{ inputs.adhoc && 'sockeye-darwin-arm64-adhoc' || 'sockeye-darwin-arm64' }}
          path: |
            build/prod/darwin-arm64/out/Final/sockeye-darwin-arm64.zip
            build/prod/darwin-arm64/out/Final/sockeye-darwin-arm64.zip.sha256

      - name: Clean up signing keychain
        if: ${{ always() && !inputs.adhoc }}
        uses: ./.github/actions/repo/import-codesign-certs
        with:
          mode: cleanup
          temporary-directory: ${{ steps.import-signing.outputs.temporary-directory }}
