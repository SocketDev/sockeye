# Baseline CI — seeded once by socket-wheelhouse (template/presets/), then
# repo-owned: edit freely. Runs check + test via the LOCAL composite actions
# under .github/actions/fleet/ (cascade-updated), referenced by ./ path — no
# cross-repo reusable workflow, no first-party `uses:@sha`. Add repo-specific
# jobs anywhere under `jobs:`.
name: 🧪 CI
run-name: CI for ${{ github.ref_name }}

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

# Fleet no-phone-home posture: CI runners don't source the shell-rc that dev
# machines get from setup-security-tools, so set every FLEET_ENV knob
# The fleet env knobs are emitted by the setup action's first step from
# .github/actions/fleet/setup/fleet-env.json; every job in this workflow runs
# setup, so nothing is declared here (a copy would only drift).
env:
  # Markdown conformance gate (markdownlint-cli2 + the socket-* GFM rules)
  # runs inside `pnpm run lint` when set. Flipped on 2026-07-12 after the
  # fleet-wide burn-down took every member to zero findings.
  LINT_MARKDOWN: '1'

jobs:
  # First step of every job is an inline git-fetch bootstrap (no third-party
  # actions/checkout) — a job's FIRST step can't call the local
  # `./.github/actions/fleet/checkout` composite, since nothing is checked out
  # yet for GitHub to resolve `./.github/actions/*` from. It shallow-fetches the
  # workspace so those composites resolve; setup-and-install then re-runs the
  # checkout composite — full history (fetch-depth 0) in the check job, since
  # the commit-history checks it runs (AI-attribution, release-boundary) read
  # the default branch's history and refuse a shallow clone rather than
  # false-green; the test matrix stays at the default depth (25 — covers CI's
  # other git operations) and runs the zizmor Actions audit (its own
  # `strategy.job-total < 2` skip runs it in the non-matrix check job, skips it
  # in the test matrix).
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          # Route context through env (no ${{ }} in the shell body —
          # zizmor expression-injection). Token authorizes the fetch inline and
          # is never persisted to .git/config.
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          # Full history: the commit-history checks (AI-attribution,
          # release-boundary) read the default branch's history and refuse a
          # shallow clone rather than false-green.
          checkout-fetch-depth: '0'
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
      - name: Run checks
        uses: ./.github/actions/fleet/run-script
        with:
          main-script: pnpm run check --all

  test:
    name: Test (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        # macOS-only: Sockeye is a Touch ID secret bridge and build.mts refuses
        # to build on any non-darwin platform, so ubuntu/windows legs can only
        # fail. The build + test run exclusively on macOS.
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          # Route context through env (no ${{ }} in the shell body —
          # zizmor expression-injection). Token authorizes the fetch inline and
          # is never persisted to .git/config.
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
      - name: Run tests
        uses: ./.github/actions/fleet/run-script
        env:
          # Authenticate build-time GitHub API reads (release listings,
          # prebuilt-artifact downloads). Unauthenticated calls share the
          # hosted runner's IP-scoped rate limit and 403 under load.
          GH_TOKEN: ${{ github.token }}
        with:
          setup-script: pnpm run build
          main-script: pnpm test --ci

  cover-shards:
    name: Coverage collection (${{ matrix.shard }}/4)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Bootstrap checkout
        shell: bash
        env:
          # Route context through env (no ${{ }} in the shell body —
          # zizmor expression-injection). Token authorizes the fetch inline and
          # is never persisted to .git/config.
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
      - name: Collect coverage
        id: coverage
        uses: ./.github/actions/fleet/run-script
        env:
          GH_TOKEN: ${{ github.token }}
          COVERAGE_SHARD: ${{ matrix.shard }}
        with:
          setup-script: pnpm run build
          main-script: pnpm run cover:shard --shard="$COVERAGE_SHARD/4"
      - name: Upload coverage collection
        uses: ./.github/actions/fleet/upload-artifact
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .cache/fleet/coverage-shards/${{ matrix.shard }}
      - name: Upload coverage diagnostics
        if: failure() && steps.coverage.outcome == 'failure'
        uses: ./.github/actions/fleet/upload-artifact
        with:
          name: coverage-diagnostics-${{ matrix.shard }}
          path: |
            .cache/fleet/coverage-shards/${{ matrix.shard }}
            .cache/fleet/coverage
            .cache/fleet/fleet-cover

  coverage:
    name: Full coverage
    needs: [cover-shards]
    if: ${{ !cancelled() && needs.cover-shards.result != 'skipped' }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Require successful coverage collection
        shell: bash
        env:
          COLLECTION_RESULT: ${{ needs.cover-shards.result }}
        run: |
          if [ "$COLLECTION_RESULT" != success ]; then
            echo "Coverage collection failed. Fix collection jobs before aggregation."
            exit 1
          fi
      - name: Bootstrap checkout
        shell: bash
        env:
          # Route context through env (no ${{ }} in the shell body —
          # zizmor expression-injection). Token authorizes the fetch inline and
          # is never persisted to .git/config.
          GITHUB_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
          TRIGGER_REF: ${{ github.sha }}
        run: |
          set -euo pipefail
          git init -q
          git config --local advice.detachedHead false
          git remote remove origin 2>/dev/null || true
          git remote add origin "${SERVER_URL}/${REPOSITORY}"
          FETCH_ARGS=(--no-tags --prune --depth 1 origin "${TRIGGER_REF}")
          if [ -n "${GITHUB_TOKEN}" ]; then
            AUTH_B64="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
            git -c "http.${SERVER_URL}/.extraheader=AUTHORIZATION: basic ${AUTH_B64}" fetch "${FETCH_ARGS[@]}"
          else
            git fetch "${FETCH_ARGS[@]}"
          fi
          git checkout -q --detach FETCH_HEAD
      - name: Set up and install
        uses: ./.github/actions/fleet/setup-and-install
        with:
          socket-api-token: ${{ secrets.SOCKET_API_TOKEN_FOR_CLI_AND_SFW }}
          payload-token-client-id: ${{ vars.SOCKET_PR_CLIENT_ID }}
          payload-token-private-key: ${{ secrets.SOCKET_PR_APP_PRIVATE_KEY }}
      - name: Download first coverage collection
        uses: ./.github/actions/fleet/download-artifact
        with:
          name: coverage-shard-1
          path: .cache/fleet/coverage-shards/1
      - name: Download second coverage collection
        uses: ./.github/actions/fleet/download-artifact
        with:
          name: coverage-shard-2
          path: .cache/fleet/coverage-shards/2
      - name: Download third coverage collection
        uses: ./.github/actions/fleet/download-artifact
        with:
          name: coverage-shard-3
          path: .cache/fleet/coverage-shards/3
      - name: Download fourth coverage collection
        uses: ./.github/actions/fleet/download-artifact
        with:
          name: coverage-shard-4
          path: .cache/fleet/coverage-shards/4
      - name: Apply full coverage gates
        id: coverage
        uses: ./.github/actions/fleet/run-script
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          setup-script: pnpm run build
          main-script: pnpm run cover:aggregate --shards=4
      - name: Upload aggregate diagnostics
        if: failure() && steps.coverage.outcome == 'failure'
        uses: ./.github/actions/fleet/upload-artifact
        with:
          name: coverage-aggregate-diagnostics
          path: .cache/fleet/coverage
